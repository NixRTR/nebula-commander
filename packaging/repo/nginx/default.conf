# pkgs.nebulacommander.com. TLS and the http->https redirect are the reverse proxy's job.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;

    # Repository metadata and the update manifest change on every publish: always revalidate,
    # so a client never pairs a new Release/repomd.xml with an old signature.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Package files never change under the same name.
    location ~ \.(deb|rpm)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Keys, signatures and source files have no standard extension mapping; show them as
    # text in a browser (apt, dnf and zypper ignore the type).
    location ~ (\.(asc|key|sources|repo|sig)|/(Release|InRelease))$ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Without this, the system bus rejects any call to
  org.beardedtek.NebulaCommander1 outright (default-deny) before polkit
  is even consulted - confirmed directly against a real dbus-daemon while
  building client/linux/dbus_server.py (AccessDenied on RequestName with no
  policy file present). The actual per-method authorization decision is
  polkit's job (see ../polkit-1/actions/org.beardedtek.NebulaCommander1.policy
  and ../polkit-1/rules.d/org.nixrtr.nebulacommander.rules) - this file only
  grants bus-level "you're allowed to own this name / send it messages",
  intentionally permissive at this layer.
-->
<busconfig>
  <policy user="root">
    <allow own="org.beardedtek.NebulaCommander1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.beardedtek.NebulaCommander1"/>
    <allow receive_sender="org.beardedtek.NebulaCommander1"/>
  </policy>
</busconfig>

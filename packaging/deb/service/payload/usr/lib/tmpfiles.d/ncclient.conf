# State dir for ncclient.service (enrollment token, settings, config.yaml,
# status.json, etc.) - root-only. The unprivileged nebula-commander-desktop
# app no longer needs direct access to this directory at all: it talks to
# client/linux/dbus_server.py's D-Bus service (hosted inside this same
# process, authorized per-call via polkit - see
# ../polkit-1/actions/org.beardedtek.NebulaCommander1.policy) instead of
# reading/writing these files itself. This also matches
# nix/client-module.nix's existing headless-mode convention exactly, so the
# two deployment modes now agree on one state-dir permission model instead
# of two.
d /var/lib/ncclient 0700 root root -

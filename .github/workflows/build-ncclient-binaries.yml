name: Build ncclient Binaries

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v0.1.5)
  pull_request:
    paths:
      - 'client/binaries/**'
      - 'client/windows/**'
      - 'client/windows-app/**'
      - 'client/ncclient.py'
      - 'installer/windows/**'
      - '.github/workflows/build-ncclient-binaries.yml'
  workflow_dispatch:  # Allow manual trigger from Actions tab

# Required for creating releases and uploading release assets
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Continue building other platforms if one fails
      matrix:
        include:
          # Linux builds (ubuntu-22.04 for GLIBC 2.35 compatibility with Ubuntu 22.04 LTS)
          - os: ubuntu-22.04
            artifact_name: ncclient
            asset_name: ncclient-linux-amd64
            platform: Linux (x86_64)
            arch: x64
          - os: ubuntu-22.04
            artifact_name: ncclient
            asset_name: ncclient-linux-arm64
            platform: Linux (ARM64)
            arch: arm64
          
          # Windows builds (GitHub has no Windows ARM64 runners; omit windows-arm64)
          - os: windows-latest
            artifact_name: ncclient.exe
            asset_name: ncclient-windows-amd64.exe
            platform: Windows (x86_64)
            arch: x64
          
          # macOS builds
          - os: macos-15-intel  # Intel Mac (macos-13 retired)
            artifact_name: ncclient
            asset_name: ncclient-macos-amd64
            platform: macOS (Intel)
            arch: x64
          - os: macos-latest  # Apple Silicon (macos-15 arm64)
            artifact_name: ncclient
            asset_name: ncclient-macos-arm64
            platform: macOS (ARM64)
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Linux ARM64 builds in Docker (no host Python); other jobs need Python on the host
      - name: Set up Python
        if: runner.os != 'Linux' || matrix.arch != 'arm64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
          cache: 'pip'

      - name: Set up QEMU (for Linux ARM64)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install dependencies
        if: runner.os != 'Linux' || matrix.arch != 'arm64'
        run: |
          python -m pip install --upgrade pip
          pip install -r client/binaries/requirements.txt
          pip install -r client/requirements.txt

      - name: Build executable (native)
        if: matrix.arch == 'x64' || runner.os == 'macOS'
        working-directory: client/binaries
        run: python build.py

      - name: Build executable (Linux ARM64 via Docker)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/work" \
            -w /work/client/binaries \
            python:3.11-slim \
            bash -c "
              apt-get update && apt-get install -y binutils &&
              pip install --upgrade pip &&
              pip install -r requirements.txt &&
              pip install -r ../requirements.txt &&
              python build.py
            "

      - name: Build executable (Windows ARM64)
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        working-directory: client/binaries
        run: python build.py
        env:
          # PyInstaller will detect ARM64 from Python architecture
          PYINSTALLER_TARGET_ARCH: arm64

      - name: Run tests (native architectures only)
        if: matrix.arch == 'x64' || runner.os == 'macOS'
        working-directory: client/binaries
        run: python build.py --test
        continue-on-error: true  # ARM64 builds may not run on x64 runners

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp client/binaries/dist/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}
          # Make executable on Unix systems
          if [ "$RUNNER_OS" != "Windows" ]; then
            chmod +x artifacts/${{ matrix.asset_name }}
          fi

      - name: Display file info
        shell: bash
        run: |
          ls -lh artifacts/
          file artifacts/${{ matrix.asset_name }} || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: artifacts/${{ matrix.asset_name }}
          if-no-files-found: error

  # Build the Windows service exe (the NebulaCommanderService that actually
  # runs as LocalSystem). The old Python/Tkinter system-tray GUI that used to
  # be built here too has been removed - client/windows-app/ (WinUI 3) is the
  # only GUI client now, built separately below in build-windows-app.
  build-windows-service:
    name: Build Windows Service
    runs-on: windows-latest
    needs: build  # Wait for CLI build to complete
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt
          pip install -r client/windows/requirements.txt
          pip install pyinstaller

      - name: Build service exe
        working-directory: client/windows
        run: python build.py

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp client/windows/dist/ncclient-service.exe artifacts/ncclient-service-windows-amd64.exe

      - name: Display file info
        shell: bash
        run: |
          ls -lh artifacts/
          file artifacts/ncclient-service-windows-amd64.exe || true

      - name: Upload service artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncclient-service-windows-amd64.exe
          path: artifacts/ncclient-service-windows-amd64.exe
          if-no-files-found: error

  # Build the windowed WinUI 3 app (client/windows-app/) - side-tab Status/
  # Enrollment/Settings UI, minimizes to tray on close. Self-contained
  # single-file publish: WindowsAppSDKSelfContained+SelfContained+
  # PublishSingleFile are already set in the csproj, so this is a plain
  # `dotnet publish` with no extra flags needed.
  build-windows-app:
    name: Build Windows App (WinUI 3)
    runs-on: windows-latest
    needs: build  # Wait for CLI build to complete, same as build-windows-service
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained single-file exe
        working-directory: client/windows-app
        run: dotnet publish -c Release -r win-x64

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp "client/windows-app/bin/Release/net10.0-windows10.0.26100.0/win-x64/publish/NebulaCommanderApp.exe" artifacts/NebulaCommanderApp-windows-amd64.exe

      - name: Display file info
        shell: bash
        run: |
          ls -lh artifacts/
          file artifacts/NebulaCommanderApp-windows-amd64.exe || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NebulaCommanderApp-windows-amd64.exe
          path: artifacts/NebulaCommanderApp-windows-amd64.exe
          if-no-files-found: error

  # Build the three Linux .deb packages (client/service/desktop) via
  # packaging/deb/build.py. Reuses the linux-amd64 binary the `build` matrix
  # job already produced instead of freezing it again - build.py's
  # --ncclient-binary flag exists specifically for this. dpkg-deb ships in
  # every Debian/Ubuntu base image (part of dpkg itself), so no extra
  # install step is needed; build.py itself is stdlib-only.
  build-deb:
    name: Build .deb Packages
    runs-on: ubuntu-22.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download linux-amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: ncclient-linux-amd64
          path: artifacts-in

      - name: Build .deb packages
        run: |
          chmod +x artifacts-in/ncclient-linux-amd64
          VERSION="${GITHUB_REF_NAME#v}"
          python3 packaging/deb/build.py --version "$VERSION" --ncclient-binary artifacts-in/ncclient-linux-amd64

      - name: Display file info
        run: ls -lh packaging/deb/dist/

      - name: Upload client .deb
        uses: actions/upload-artifact@v4
        with:
          name: nebula-commander-client.deb
          path: packaging/deb/dist/nebula-commander-client_*_amd64.deb
          if-no-files-found: error

      - name: Upload service .deb
        uses: actions/upload-artifact@v4
        with:
          name: nebula-commander-service.deb
          path: packaging/deb/dist/nebula-commander-service_*_all.deb
          if-no-files-found: error

      - name: Upload desktop .deb
        uses: actions/upload-artifact@v4
        with:
          name: nebula-commander-desktop.deb
          path: packaging/deb/dist/nebula-commander-desktop_*_all.deb
          if-no-files-found: error

  # Build the three .rpm packages via packaging/rpm/build.py - same split,
  # same reused linux-amd64 binary, same shared packaging/deb/*/payload
  # source of truth as build-deb above (see that script's own module
  # docstring for why the payload files aren't duplicated per packaging
  # system). Debian/Ubuntu's own `rpm` package provides `rpmbuild` for
  # cross-building, so this runs on the same ubuntu-22.04 runner as
  # build-deb rather than needing a separate Fedora/RHEL container.
  build-rpm:
    name: Build .rpm Packages
    runs-on: ubuntu-22.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Download linux-amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: ncclient-linux-amd64
          path: artifacts-in

      - name: Build .rpm packages
        run: |
          chmod +x artifacts-in/ncclient-linux-amd64
          VERSION="${GITHUB_REF_NAME#v}"
          python3 packaging/rpm/build.py --version "$VERSION" --ncclient-binary artifacts-in/ncclient-linux-amd64

      - name: Display file info
        run: ls -lh packaging/rpm/dist/

      - name: Upload client .rpm
        uses: actions/upload-artifact@v4
        with:
          name: nebula-commander-client.rpm
          path: packaging/rpm/dist/nebula-commander-client-*.x86_64.rpm
          if-no-files-found: error

      - name: Upload service .rpm
        uses: actions/upload-artifact@v4
        with:
          name: nebula-commander-service.rpm
          path: packaging/rpm/dist/nebula-commander-service-*.noarch.rpm
          if-no-files-found: error

      - name: Upload desktop .rpm
        uses: actions/upload-artifact@v4
        with:
          name: nebula-commander-desktop.rpm
          path: packaging/rpm/dist/nebula-commander-desktop-*.noarch.rpm
          if-no-files-found: error

  # Build the Flatpak bundle. Independent of the `build` job (the desktop
  # app ships as plain Python, not the frozen ncclient binary) - runs in
  # parallel. See packaging/flatpak/org.beardedtek.NebulaCommander.yaml's
  # own comments for why sources are vendored via sync-sources.py rather
  # than referencing client/ directly (Flathub submission repos are
  # isolated from this monorepo).
  build-flatpak:
    name: Build Flatpak Bundle
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub remote
        run: flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME runtime/SDK
        run: flatpak install --user -y flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Vendor client sources
        working-directory: packaging/flatpak
        run: python3 sync-sources.py

      - name: Build and export
        working-directory: packaging/flatpak
        run: |
          flatpak-builder --force-clean --user --repo=repo --install-deps-from=flathub \
            build-dir org.beardedtek.NebulaCommander.yaml

      - name: Bundle
        working-directory: packaging/flatpak
        run: flatpak build-bundle repo org.beardedtek.NebulaCommander.flatpak org.beardedtek.NebulaCommander

      - name: Display file info
        run: ls -lh packaging/flatpak/org.beardedtek.NebulaCommander.flatpak

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: org.beardedtek.NebulaCommander.flatpak
          path: packaging/flatpak/org.beardedtek.NebulaCommander.flatpak
          if-no-files-found: error

  # Build Windows MSI installer (ncclient + ncclient-service + NebulaCommanderApp)
  build-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    needs: [build, build-windows-service, build-windows-app]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts-in

      - name: Prepare redist folder
        run: |
          New-Item -ItemType Directory -Force -Path installer\windows\redist
          Copy-Item "artifacts-in\ncclient-windows-amd64.exe\ncclient-windows-amd64.exe" "installer\windows\redist\ncclient.exe"
          Copy-Item "artifacts-in\ncclient-service-windows-amd64.exe\ncclient-service-windows-amd64.exe" "installer\windows\redist\ncclient-service.exe"
          Copy-Item "artifacts-in\NebulaCommanderApp-windows-amd64.exe\NebulaCommanderApp-windows-amd64.exe" "installer\windows\redist\NebulaCommanderApp.exe"

      - name: Install WiX 5
        run: dotnet tool install --global wix --version 5.0.2

      - name: Add WiX Util extension
        run: wix extension add -g WixToolset.Util.wixext/5.0.0

      - name: Add WiX UI extension
        run: wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Build MSI
        id: build-msi
        working-directory: installer/windows
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          # MSI ProductVersion must be purely numeric dotted (major.minor.build); a semver
          # pre-release suffix like "-rc1" is invalid there and produces an out-of-spec MSI
          # (WiX only warns, never errors, so this must be stripped explicitly).
          $msiVersion = $version -replace '-.*$', ''
          wix build Product.wxs -ext WixToolset.Util.wixext -ext WixToolset.UI.wixext -o NebulaCommander-windows-amd64.msi -d "Version=$msiVersion" -arch x64
          if (-not (Test-Path NebulaCommander-windows-amd64.msi)) { exit 1 }
          (Get-Item NebulaCommander-windows-amd64.msi).Length

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: NebulaCommander-windows-amd64.msi
          path: installer/windows/NebulaCommander-windows-amd64.msi

  # Upload all binaries and checksums to GitHub Release (single job to avoid concurrent finalization)
  upload-release:
    name: Upload to Release
    needs: [build, build-windows-service, build-msi, build-deb, build-rpm, build-flatpak]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and prepare release files
        run: |
          cd artifacts
          for d in */; do
            [ ! -d "$d" ] && continue
            d="${d%/}"
            f=$(find "$d" -maxdepth 1 -type f -print -quit)
            [ -z "$f" ] && continue
            mv "$f" "./.tmp_$d"
            rmdir "$d" 2>/dev/null || true
            mv "./.tmp_$d" "./$d"
          done
          sha256sum ncclient* NebulaCommander* nebula-commander-*.deb nebula-commander-*.rpm org.beardedtek.NebulaCommander.flatpak > SHA256SUMS.txt
          echo "=== Release files ==="
          ls -la
          echo "=== Checksums ==="
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2.4.2
        with:
          files: artifacts/*
          draft: false
          # SemVer convention: a tag with a hyphen (e.g. v0.3.0-rc1) is a pre-release,
          # so it won't be marked GitHub's "Latest" and displace a stable release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Generate checksums artifact (for Actions UI; release gets checksums from upload-release job)
  checksums:
    name: Generate Checksums
    needs: [build, build-windows-service, build-windows-app, build-deb, build-rpm, build-flatpak]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          # Each artifact is in its own subdirectory (same name as file); move files out
          for d in */; do
            [ ! -d "$d" ] && continue
            d="${d%/}"
            f=$(find "$d" -maxdepth 1 -type f -print -quit)
            [ -z "$f" ] && continue
            mv "$f" "./.tmp_$d"
            rmdir "$d" 2>/dev/null || true
            mv "./.tmp_$d" "./$d"
          done
          sha256sum ncclient* NebulaCommander* nebula-commander-*.deb nebula-commander-*.rpm org.beardedtek.NebulaCommander.flatpak > SHA256SUMS.txt
          echo "=== Checksums ==="
          cat SHA256SUMS.txt

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS.txt

  # Summary job to report build status
  summary:
    name: Build Summary
    needs: [build, build-windows-service, build-windows-app, build-deb, build-rpm, build-flatpak]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check build status
        run: |
          echo "Build completed!"
          echo "Artifacts are available in the Actions tab."
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]; then
            echo "Release binaries have been uploaded to the release."
          fi

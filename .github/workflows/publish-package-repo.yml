name: Publish Package Repository

# Rebuilds the signed apt + rpm repository at https://pkgs.nebulacommander.com
# (GitHub Pages) from the .deb/.rpm assets of the newest stable GitHub Releases,
# after each successful tagged release build. The repo has no state of its own:
# every run regenerates it from the Releases (packaging/repo/build_repo.py), so
# workflow_dispatch can rebuild or re-sign it at any time.
#
# Needs repository secrets PACKAGE_SIGNING_KEY (armored private key) and
# PACKAGE_SIGNING_KEY_PASSPHRASE, and Pages set to "GitHub Actions" with the
# custom domain pkgs.nebulacommander.com.

on:
  workflow_run:
    workflows: ["Build ncclient Binaries"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # How many releases (that ship Linux packages) to keep in the repo.
  KEEP_RELEASES: 5

jobs:
  gate:
    name: Check trigger
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Checkout (for tag resolution)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only publish after a successful stable release build
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Binaries workflow did not succeed, skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG=$(git describe --tags --exact-match "${{ github.event.workflow_run.head_sha }}" 2>/dev/null || true)
          case "$TAG" in
            v*-*) echo "Pre-release $TAG, skipping"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            v*)   echo "Stable release $TAG"; echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)    echo "Not a release tag build, skipping"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: Build signed repository
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c rpm gnupg

      - name: Download packages from the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kept=0
          for tag in $(gh release list --exclude-pre-releases --exclude-drafts --limit 30 --json tagName --jq '.[].tagName'); do
            mkdir -p "in/$tag"
            if gh release download "$tag" -D "in/$tag" -p 'nebula-commander-*.deb' -p 'nebula-commander-*.rpm' 2>/dev/null; then
              echo "$tag: $(ls "in/$tag" | tr '\n' ' ')"
              kept=$((kept + 1))
              [ "$kept" -ge "$KEEP_RELEASES" ] && break
            else
              rmdir "in/$tag"   # older releases have no Linux packages
            fi
          done
          if [ "$kept" -eq 0 ]; then
            echo "::error::No releases with Linux packages found"
            exit 1
          fi

      - name: Import signing key
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          if [ -z "$PACKAGE_SIGNING_KEY" ]; then
            echo "::error::PACKAGE_SIGNING_KEY secret is not set"
            exit 1
          fi
          printf '%s\n' "$PACKAGE_SIGNING_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "Signing with $KEY_ID"

      - name: Build repository
        env:
          PACKAGE_SIGNING_KEY_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_KEY_PASSPHRASE }}
        run: python3 packaging/repo/build_repo.py --input in --output site --key-id "$KEY_ID"

      - name: Verify signatures
        run: |
          gpg --verify site/deb/dists/stable/InRelease
          gpg --verify site/rpm/repodata/repomd.xml.asc site/rpm/repodata/repomd.xml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Publish Package Repository

# Rebuilds the signed apt + rpm repository served at https://pkgs.nebulacommander.com
# from the .deb/.rpm assets of the newest stable GitHub Releases, after each
# successful tagged release build. The repo has no state of its own: every run
# regenerates it from the Releases (packaging/repo/build_repo.py), so
# workflow_dispatch can rebuild or re-sign it at any time.
#
# The site is published as an nginx image (packaging/repo/nginx/), tagged with the
# newest release's version and `latest`:
#   ghcr.io/nebula-commander/pkgs
# The Cloud server behind pkgs.nebulacommander.com runs `latest` and Watchtower
# picks up each new image (nebula-commander-cloud: deploy/pkgs/).
#
# Needs repository secrets PACKAGE_SIGNING_KEY (armored private key) and
# PACKAGE_SIGNING_KEY_PASSPHRASE.
#
# Also publishes the signed client auto-update manifest (updates/latest.json +
# .sig, see client/updates.py) for the newest stable release, signed with the
# UPDATE_SIGNING_KEY secret (Ed25519, see docs/update-signing.md).

on:
  workflow_run:
    workflows: ["Build ncclient Binaries"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-repo
  cancel-in-progress: false

env:
  # How many releases (that ship Linux packages) to keep in the repo.
  KEEP_RELEASES: 5
  REGISTRY: ghcr.io
  PKGS_IMAGE_NAME: nebula-commander/pkgs

jobs:
  gate:
    name: Check trigger
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Checkout (for tag resolution)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only publish after a successful stable release build
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "Binaries workflow did not succeed, skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG=$(git describe --tags --exact-match "${{ github.event.workflow_run.head_sha }}" 2>/dev/null || true)
          case "$TAG" in
            v*-*) echo "Pre-release $TAG, skipping"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            v*)   echo "Stable release $TAG"; echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)    echo "Not a release tag build, skipping"; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: Build signed repository
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, for the update manifest's commit

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c rpm gnupg python3-cryptography

      - name: Download packages from the newest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kept=0
          for tag in $(gh release list --exclude-pre-releases --exclude-drafts --limit 30 --json tagName --jq '.[].tagName'); do
            mkdir -p "in/$tag"
            if gh release download "$tag" -D "in/$tag" -p 'nebula-commander-*.deb' -p 'nebula-commander-*.rpm' 2>/dev/null; then
              echo "$tag: $(ls "in/$tag" | tr '\n' ' ')"
              kept=$((kept + 1))
              [ "$kept" -ge "$KEEP_RELEASES" ] && break
            else
              rmdir "in/$tag"   # older releases have no Linux packages
            fi
          done
          if [ "$kept" -eq 0 ]; then
            echo "::error::No releases with Linux packages found"
            exit 1
          fi

      - name: Import signing key
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
        run: |
          if [ -z "$PACKAGE_SIGNING_KEY" ]; then
            echo "::error::PACKAGE_SIGNING_KEY secret is not set"
            exit 1
          fi
          printf '%s\n' "$PACKAGE_SIGNING_KEY" | gpg --batch --import
          KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          echo "KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "Signing with $KEY_ID"

      - name: Build repository
        env:
          PACKAGE_SIGNING_KEY_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_KEY_PASSPHRASE }}
        run: python3 packaging/repo/build_repo.py --input in --output site --key-id "$KEY_ID"

      - name: Verify signatures
        run: |
          gpg --verify site/deb/dists/stable/InRelease
          gpg --verify site/rpm/repodata/repomd.xml.asc site/rpm/repodata/repomd.xml

      - name: Sign the client update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::UPDATE_SIGNING_KEY secret is not set - publishing without an update manifest (clients won't auto-update)"
            exit 0
          fi
          TAG=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          RELEASED=$(gh release view "$TAG" --json publishedAt --jq .publishedAt)
          gh release download "$TAG" -D sums -p SHA256SUMS.txt
          python3 packaging/repo/build_update_manifest.py --tag "$TAG" --sums sums/SHA256SUMS.txt             --released "$RELEASED" --output site/updates
          cat site/updates/latest.json

      - name: Stage image context
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir image
          cp packaging/repo/nginx/Dockerfile packaging/repo/nginx/default.conf image/
          mv site image/site
          TAG=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the image
        run: |
          docker build -t pkgs-test image
          docker run -d --name pkgs-test -p 8080:80 pkgs-test
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1; done
          for path in / /gpg.key /deb/dists/stable/InRelease /rpm/repodata/repomd.xml.asc; do
            curl -fsS -o /dev/null "http://127.0.0.1:8080$path" || { echo "::error::$path not served"; docker logs pkgs-test; exit 1; }
          done
          if [ -f image/site/updates/latest.json ]; then
            curl -fsS http://127.0.0.1:8080/updates/latest.json
          fi
          docker rm -f pkgs-test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PKGS_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.image.outputs.version }}
            type=raw,value=latest

      - name: Build and push package repository image
        uses: docker/build-push-action@v5
        with:
          context: image
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
